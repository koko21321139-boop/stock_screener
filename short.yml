name: short-screen

on:
  schedule:
    # 平日 16:53 JST（07:53 UTC）。ロング版（16:37）の後に動かす
    - cron: "53 7 * * 1-5"
    # 火〜土 7:23 JST（22:23 UTC）。Yahoo Finance への反映が遅れた前日分を取り直す
    - cron: "23 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run short screening
        env:
          UNIVERSE: ${{ vars.UNIVERSE || 'prime' }}
        run: python scripts/short_screen.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/short.json
          git diff --cached --quiet && exit 0
          git commit -m "short screen $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
