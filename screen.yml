name: スクリーニング

on:
  schedule:
    - cron: '37 7 * * 1-5'    # 平日 16:37（日本時間）。大引け後のデータで判定。GitHubの混雑で遅れることがある
    - cron: '13 22 * * 1-5'   # 火〜土 7:13（日本時間）。Yahoo Finance への反映が遅れた前日分を取り直す
  workflow_dispatch:          # Actions 画面の「Run workflow」で手動実行もできる

permissions:
  contents: write             # 結果を data/ にコミットするため

concurrency: screen

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 株価を取得してスクリーニング
        run: python scripts/screen.py
        env:
          UNIVERSE: ${{ vars.UNIVERSE }}
          MIN_TURNOVER: ${{ vars.MIN_TURNOVER }}
      - name: moomoo のウォッチリストに同期（キーが無ければ何もしない）
        continue-on-error: true     # 失敗してもスクリーニング結果の保存は続ける
        run: python scripts/moomoo_sync.py
        env:
          MOOMOO_APP_KEY: ${{ secrets.MOOMOO_APP_KEY }}
          MOOMOO_PRIVATE_KEY: ${{ secrets.MOOMOO_PRIVATE_KEY }}
          MOOMOO_GROUP: ${{ vars.MOOMOO_GROUP }}
          MOOMOO_MAX: ${{ vars.MOOMOO_MAX }}
      - name: 前回より古い日付のデータなら保存しない
        run: |
          python - <<'PY'
          import json, subprocess, sys
          try:
              old = json.loads(subprocess.run(["git", "show", "HEAD:data/screen.json"],
                                              capture_output=True, text=True, check=True).stdout).get("asof", "")
          except Exception:
              sys.exit(0)
          new = json.load(open("data/screen.json")).get("asof", "")
          if new < old:
              print(f"取得できたデータ（{new}）が前回（{old}）より古いので、今回の結果は保存しません")
              subprocess.run(["git", "checkout", "--", "data"], check=True)
          PY
      - name: 変更があればコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "スクリーニング結果（$(TZ=Asia/Tokyo date +%F)）"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
