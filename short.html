<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7f1d1d">
<link rel="manifest" href="manifest.webmanifest">
<title>ショート候補（Stage 4）</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --fg:#1b1b1f; --sub:#6b6b75; --line:#e4e4e8;
          --red:#b42318; --redbg:#fde8e6; --amber:#9a6700; --amberbg:#fff4d6; --green:#1a7f37; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111114; --card:#1c1c21; --fg:#ececf1; --sub:#9a9aa6; --line:#2c2c33;
            --red:#ff7b72; --redbg:#3a1816; --amber:#e3b341; --amberbg:#332a10; --green:#56d364; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
         padding:env(safe-area-inset-top) 12px 90px; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 2px 4px; }
  h1 { font-size:20px; margin:0; }
  a.back { color:var(--sub); text-decoration:none; font-size:14px; }
  .meta { color:var(--sub); font-size:13px; margin:0 2px 10px; }
  .market { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:10px 12px; margin-bottom:10px; }
  .market b { font-size:16px; }
  .tabs { display:flex; gap:6px; margin:10px 0; }
  .tabs button { flex:1; border:1px solid var(--line); background:var(--card); color:var(--fg);
                 border-radius:10px; padding:8px 4px; font-size:14px; }
  .tabs button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:10px 12px; margin-bottom:8px; }
  .row1 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .name { font-weight:600; }
  .code { color:var(--sub); font-size:13px; margin-left:4px; }
  .price { font-variant-numeric:tabular-nums; font-weight:600; }
  .tags { margin:4px 0; display:flex; flex-wrap:wrap; gap:4px; }
  .tag { font-size:12px; padding:1px 7px; border-radius:999px; }
  .t-red { background:var(--redbg); color:var(--red); }
  .t-amb { background:var(--amberbg); color:var(--amber); }
  .nums { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; font-size:13px; color:var(--sub); }
  .nums span b { color:var(--fg); font-variant-numeric:tabular-nums; }
  details { margin-top:6px; font-size:13px; }
  details li { list-style:none; }
  .ok { color:var(--green); } .ng { color:var(--sub); }
  .empty { color:var(--sub); text-align:center; padding:30px 0; }
  .note { color:var(--sub); font-size:12px; margin-top:16px; }
  .plan { display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:4px; margin-top:8px; padding:7px 8px;
          border-radius:10px; background:var(--bg); font-size:11px; color:var(--sub); text-align:center; line-height:1.3; }
  .plan b { display:block; font-size:13px; color:var(--fg); font-variant-numeric:tabular-nums; }
  .plan .sell b { color:var(--red); } .plan .cut b { color:var(--green); }
  .plan .st { grid-column:1/-1; font-size:11.5px; text-align:left; }
  .alert { background:var(--redbg); color:var(--red); border-radius:12px; padding:10px 12px; margin-bottom:10px; font-size:14px; }
  .alert b { display:block; font-size:15px; }
  .t-warn { background:var(--amberbg); color:var(--amber); font-weight:700; }
  .t-sec { background:var(--redbg); color:var(--red); }
  .srow { display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0; }
  .srow .nm { width:9.5em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .bar { flex:1; height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
  .srow .bar i { display:block; height:100%; background:var(--sub); }
  .srow.weak .bar i { background:var(--red); }
  .srow .v { width:3.5em; text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>ショート候補</h1>
  <a class="back" href="#" onclick="location.reload();return false;">更新</a>
</header>
<div class="meta" id="meta">読み込み中…</div>
<div id="alert"></div>
<div class="market" id="market"></div>
<div class="tabs">
  <button data-f="zone" class="on">戻り売り</button>
  <button data-f="all">全条件</button>
  <button data-f="near">あと一歩</button>
  <button data-f="sector">業種</button>
</div>
<div id="list"></div>
<p class="note">Stage 4（ワインスタイン）＋オニール流の空売り条件による機械的な抽出です。投資助言ではありません。
制度信用で売れるのは貸借銘柄のみ（このリストでは未判定）。逆日歩と踏み上げに注意してください。
「売り抜け」の数字は直近50日の上げ日÷下げ日の出来高比で、1未満は売りが優勢。決算日・権利落ち日は Yahoo Finance のデータで、欠けている銘柄もあります。</p>

<script src="nav.js"></script>
<script>
let DATA = null, FILTER = "zone";
const $ = (s) => document.querySelector(s);

const yen = (v) => v == null ? "—" : Math.round(v).toLocaleString("ja-JP");
// エントリー目安：50日線への戻りで売る（オニール／モラレス流）。損切りは50日線+4%、利確目安は-20%
function plan(s) {
  if (s.entry_hi == null) return "";
  let st;
  if (s.close < s.entry_lo) st = `戻り待ち：あと${((s.entry_lo / s.close - 1) * 100).toFixed(1)}%戻したら売りゾーン`;
  else if (s.close <= s.entry_hi) st = "売りゾーン内：戻り売りのタイミング";
  else if (s.close < s.stop) st = "50日線の上：売らずに様子見";
  else st = "50日線を回復：見送り";
  return `<div class="plan">
    <span class="sell">売り<b>${yen(s.entry_lo)}〜${yen(s.entry_hi)}</b></span>
    <span class="cut">損切り<b>${yen(s.stop)}</b></span>
    <span>利確目安<b>${yen(s.target)}</b></span>
    <span class="st">${st}。戻りを待たない場合は ${yen(s.breakdown)} 割れで売り</span></div>`;
}

const md = (d) => d ? d.slice(5).replace("-", "/") : "";

function sectorView() {
  const th = (DATA.params?.sector_weak_ratio ?? 0.4) * 100;
  const rows = (DATA.sectors || []).map((g) => `<div class="srow ${g.stage4_pct >= th ? "weak" : ""}">
    <span class="nm">${g.sector}</span><span class="bar"><i style="width:${g.stage4_pct}%"></i></span>
    <span class="v">${g.stage4_pct}%</span></div>`).join("");
  return `<div class="card"><div style="font-weight:600;margin-bottom:4px">業種ごとのステージ4の割合</div>
    ${rows || '<div class="empty">データなし</div>'}
    <p class="note" style="margin-top:8px">業種内で、株価が下向きの150日線（30週線）の下にある銘柄の割合です。赤は${th}%以上の弱い業種。ワインスタインは「弱い業種の弱い銘柄を売る」ことを重視しました。</p></div>`;
}

function card(s, conds) {
  const tags = [];
  if (s.all_pass) tags.push('<span class="tag t-red">全条件</span>');
  if (s.rally_zone) tags.push('<span class="tag t-amb">戻り売りゾーン</span>');
  if (s.c11) tags.push(`<span class="tag t-sec">弱い業種 ${s.sector_stage4_pct}%</span>`);
  if (s.c12) tags.push(`<span class="tag t-sec">売り抜け ${s.ud_ratio}</span>`);
  if (s.earnings_soon) tags.push(`<span class="tag t-warn">⚠ 決算 ${md(s.earnings_date)}</span>`);
  if (s.exdiv_soon) tags.push(`<span class="tag t-warn">⚠ 権利落ち ${md(s.exdiv_date)}</span>`);
  const checks = Object.entries(conds).map(([k, label]) =>
    `<li class="${s[k] ? "ok" : "ng"}">${s[k] ? "✓" : "–"} ${label}</li>`).join("");
  return `<div class="card">
    <div class="row1"><div><span class="name">${s.name}</span><span class="code">${s.code}</span></div>
      <div class="price">${s.close.toLocaleString()}</div></div>
    <div class="tags">${tags.join("")}<span class="tag" style="color:var(--sub)">${s.sector}</span></div>
    <div class="nums">
      <span>高値比 <b>${s.drawdown_pct}%</b></span>
      <span>50日線 <b>${s.dist_50ma_pct > 0 ? "+" : ""}${s.dist_50ma_pct}%</b></span>
      <span>RS <b>${s.rs}</b></span>
      <span>代金 <b>${s.turnover_oku}億</b></span>
      <span>条件 <b>${s.score}/${Object.keys(conds).length}</b></span>
      <span></span>
    </div>
    ${plan(s)}
    <details><summary>条件の内訳</summary><ul style="padding:0;margin:4px 0">${checks}</ul></details>
  </div>`;
}

function render() {
  if (!DATA) return;
  if (FILTER === "sector") { $("#list").innerHTML = sectorView(); return; }
  const total = Object.keys(DATA.conditions).length;
  let xs = DATA.stocks;
  if (FILTER === "zone") xs = xs.filter((s) => s.rally_zone && s.score >= total - 2);
  if (FILTER === "all") xs = xs.filter((s) => s.all_pass);
  if (FILTER === "near") xs = xs.filter((s) => !s.all_pass);
  $("#list").innerHTML = xs.length
    ? xs.map((s) => card(s, DATA.conditions)).join("")
    : '<div class="empty">該当なし</div>';
}

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.remove("on"));
  b.classList.add("on"); FILTER = b.dataset.f; render();
});

fetch("data/short.json?t=" + Date.now()).then((r) => r.json()).then((d) => {
  DATA = d;
  $("#meta").textContent = `更新 ${d.updated}　対象 ${d.universe_size} 銘柄`;
  const m = d.market || {};
  $("#market").innerHTML = `地合い（TOPIX 1306）：<b>${m.label || "-"}</b>`;
  if (m.cover_alert) $("#alert").innerHTML = `<div class="alert"><b>⚠ 買い戻しを検討</b>${(m.cover_reasons || []).join("<br>")}<br>
    地合いが反転し始めたサインです。ショート中なら利益確定・損切りの位置を引き上げ、新規のショートは控えめに。</div>`;
  render();
}).catch(() => {
  $("#meta").textContent = "data/short.json がまだありません。Actions で short-screen を実行してください。";
});
</script>
</body>
</html>
